# Local storage servers for the upload adapters' tests: MinIO (S3) and Azurite (Azure Blob),
# with their well-known development credentials, and the harness in front of them (harness.mjs).
# Only the harness's ports are published:
#   8790  control API (makes uploads, presigns URLs, checks objects, injects faults)
#   8791  S3 endpoint, a recording proxy in front of MinIO
#   8792  Azure Blob endpoint, a recording proxy in front of Azurite
# Start with `npm run servers:up`, stop with `npm run servers:down`.
name: background-transfer-test-servers

services:
  minio:
    # MinIO no longer publishes images or binaries, so it is built here from its own repository at
    # a pinned release (minio.Dockerfile), the same one CI's macOS job builds. The first
    # `up` takes a few minutes for the build.
    build:
      context: .
      dockerfile: minio.Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    image: background-transfer-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --quiet
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    mem_limit: 512m

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck --loose
    mem_limit: 512m

  harness:
    image: node:22.20-alpine
    command: node /harness/harness.mjs
    volumes:
      - ./harness.mjs:/harness/harness.mjs:ro
    environment:
      S3_UPSTREAM: http://minio:9000
      AZURE_UPSTREAM: http://azurite:10000
    # This machine only; the Android emulator's 10.0.2.2 and the iOS simulator reach it there.
    ports:
      - "127.0.0.1:8790:8790"
      - "127.0.0.1:8791:8791"
      - "127.0.0.1:8792:8792"
    mem_limit: 192m
    depends_on:
      - minio
      - azurite
    # Healthy once MinIO and Azurite answer too.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8790/health"]
      interval: 2s
      timeout: 2s
      retries: 30
