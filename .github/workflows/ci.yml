name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 20
  JAVA_VERSION: 21

jobs:
  secrets:
    name: Secret scan
    # Every push and pull request, whoever opened it: a key or credentials file that slipped into
    # a commit would otherwise be published with the repository.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify
    # Pull requests are only verified when Dependabot opens them, so they can
    # merge themselves; everything else is verified on the push to main.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - name: Lint
        run: npm run eslint && npm run prettier -- --check
      - name: Typecheck, Vitest and build
        run: npm run typecheck && npm test && npm run build
      - name: Android unit tests
        run: npm run test:android
      - name: iOS core tests
        run: npm run test:ios
      # macOS runners have no Docker, so the Swift tests' servers run natively here: MinIO built
      # from its own repository at a pinned release (it no longer publishes binaries or images, and
      # Homebrew's formula is deprecated), Azurite from npm at a pinned version, and the harness.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build MinIO
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          git clone --depth 1 --branch "$MINIO_RELEASE" https://github.com/minio/minio "$RUNNER_TEMP/minio-src"
          (cd "$RUNNER_TEMP/minio-src" && go build -o "$RUNNER_TEMP/minio" .)
      - name: Start MinIO, Azurite and the harness
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data" "$RUNNER_TEMP/azurite"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          nohup npx --yes azurite@3.37.0 azurite-blob --blobHost 127.0.0.1 --blobPort 10000 --location "$RUNNER_TEMP/azurite" --skipApiVersionCheck --loose > "$RUNNER_TEMP/azurite.log" 2>&1 &
          S3_UPSTREAM=http://127.0.0.1:9000 AZURE_UPSTREAM=http://127.0.0.1:10000 nohup node test-servers/harness.mjs > "$RUNNER_TEMP/harness.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8790/health && break; sleep 2; done
          curl -fs http://localhost:8790/health
      - name: iOS core tests against the servers
        env:
          BT_HARNESS: http://localhost:8790
        run: npm run test:ios
      - name: iOS build
        run: npm run verify:ios

  servers-jvm:
    name: Android tests against MinIO and Azurite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - name: JUnit against MinIO and Azurite (compose; stops them afterwards)
        run: npm run test:servers

  dependabot-merge:
    name: Merge Dependabot update
    needs: [verify, servers-jvm]
    # Patch and minor updates merge once Verify and the server tests pass. Major updates stay open
    # for review, as do pull requests someone else has pushed to.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge "$PR_URL" --merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
