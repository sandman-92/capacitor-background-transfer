name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job gets a read-only token unless it says otherwise.
permissions:
  contents: read

env:
  NODE_VERSION: 20
  JAVA_VERSION: 21

jobs:
  secrets:
    name: Secret scan
    # Every push and pull request, whoever opened it: a key or credentials file that slipped into
    # a commit would otherwise be published with the repository.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a pull request's commits to scan them
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify
    # Pull requests are only verified when Dependabot opens them, so they can
    # merge themselves; everything else is verified on the push to main.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - name: Lint
        run: npm run eslint && npm run prettier -- --check
      - name: Typecheck, Vitest and build
        run: npm run typecheck && npm test && npm run build
      - name: Android unit tests
        run: npm run test:android
      - name: iOS core tests
        run: npm run test:ios
      # macOS runners have no Docker, so the Swift tests' servers run natively here: MinIO built
      # from its own repository at a pinned release (it no longer publishes binaries or images, and
      # Homebrew's formula is deprecated), Azurite from npm at a pinned version, and the harness.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - name: Build MinIO
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          git clone --depth 1 --branch "$MINIO_RELEASE" https://github.com/minio/minio "$RUNNER_TEMP/minio-src"
          (cd "$RUNNER_TEMP/minio-src" && go build -o "$RUNNER_TEMP/minio" .)
      - name: Start MinIO, Azurite and the harness
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data" "$RUNNER_TEMP/azurite"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          nohup npx --yes azurite@3.37.0 azurite-blob --blobHost 127.0.0.1 --blobPort 10000 --location "$RUNNER_TEMP/azurite" --skipApiVersionCheck --loose > "$RUNNER_TEMP/azurite.log" 2>&1 &
          S3_UPSTREAM=http://127.0.0.1:9000 AZURE_UPSTREAM=http://127.0.0.1:10000 nohup node test-servers/harness.mjs > "$RUNNER_TEMP/harness.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:8790/health && break; sleep 2; done
          curl -fs http://localhost:8790/health
      - name: iOS core tests against the servers
        env:
          BT_HARNESS: http://localhost:8790
        run: npm run test:ios
      - name: iOS build
        run: npm run verify:ios

  servers-jvm:
    name: Android tests against MinIO and Azurite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - name: JUnit against MinIO and Azurite (compose; stops them afterwards)
        run: npm run test:servers

  workflows:
    name: Workflow checks
    # Every push and pull request: zizmor (security) and actionlint (correctness) over the
    # workflows, the release checks action and dependabot.yml. Any high or medium zizmor finding,
    # or any actionlint error, fails the job. Findings accepted on purpose carry an inline
    # `# zizmor: ignore[...]` with the reason. Both tools are release binaries at exact versions,
    # checked against their published SHA-256 digests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZIZMOR_VERSION: 1.31.1
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install zizmor and actionlint
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  zizmor.tar.gz\n%s  actionlint.tar.gz\n' "$ZIZMOR_SHA256" "$ACTIONLINT_SHA256" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C "$bin" zizmor
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
      - name: zizmor (fails on high or medium)
        run: |
          zizmor --version
          zizmor --offline --min-severity medium --format github .
      - name: actionlint
        run: |
          actionlint --version
          actionlint -color

  dependabot-merge:
    name: Merge Dependabot update
    needs: [verify, servers-jvm, workflows]
    # Patch and minor npm security updates merge once Verify, the server tests and the workflow
    # checks pass. Major updates stay open for review, and so does any pull request that isn't
    # purely Dependabot's own: it must be opened by Dependabot, from a branch in this repository,
    # and every commit on it authored by Dependabot and signed by GitHub. Who triggered the run
    # (github.actor) isn't checked: it can be spoofed. A pull request that touches
    # .github/workflows/ or .github/actions/ (every actions update does) stays open for a person to
    # merge: GITHUB_TOKEN can't be given the workflows permission a merge of it needs.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh pr merge merges into main
      pull-requests: write # and closes the pull request
    steps:
      - name: Every commit is Dependabot's own
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # One line per commit: sha, author, committer, whether GitHub verified its signature.
          commits="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | [.sha, (.author.login // "-"), (.committer.login // "-"), (.commit.verification.verified | tostring)] | @tsv')"
          own=true
          last=
          while IFS=$'\t' read -r sha author committer verified; do
            last="$sha"
            if [ "$author" = 'dependabot[bot]' ] && [ "$committer" = web-flow ] && [ "$verified" = true ]; then
              echo "$sha: authored by dependabot[bot], signed by GitHub"
            else
              echo "::warning::$sha (author ${author:--}, committer ${committer:--}, verified ${verified:--}) isn't Dependabot's own commit: leaving the pull request open"
              own=false
            fi
          done <<< "$commits"
          if [ "$last" != "$HEAD_SHA" ]; then
            echo "::warning::the pull request's head is ${last:-unknown} now, not the $HEAD_SHA this run tested: leaving it open"
            own=false
          fi
          echo "dependabot-only=$own" >> "$GITHUB_OUTPUT"
      - name: Nothing a person has to merge
        id: files
        if: steps.commits.outputs.dependabot-only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          workflow_files="$(grep -E '^\.github/(workflows|actions)/' <<< "$files" || true)"
          if [ -n "$workflow_files" ]; then
            echo "::notice::this pull request changes the workflows, which GITHUB_TOKEN can't merge: a person must review and merge it ($(tr '\n' ' ' <<< "$workflow_files"))"
            echo "needs-person=true" >> "$GITHUB_OUTPUT"
          else
            echo "no file under .github/workflows/ or .github/actions/"
            echo "needs-person=false" >> "$GITHUB_OUTPUT"
          fi
      - id: metadata
        if: steps.commits.outputs.dependabot-only == 'true' && steps.files.outputs.needs-person == 'false'
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # --match-head-commit: if anything is pushed after the check above, GitHub refuses the merge.
      - if: >-
          steps.commits.outputs.dependabot-only == 'true' &&
          steps.files.outputs.needs-person == 'false' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
