name: Release

# Publishing a GitHub release tagged vX.Y.Z publishes that version to npm. The tag must name the
# version in package.json, CHANGELOG.md must have a dated entry for it, and the tagged commit must
# be on main. A release marked pre-release goes out under the `next` dist-tag; a full release
# under `latest`; and unticking pre-release later moves `latest` to that version. Started by hand
# (Actions → Release → Run workflow), it runs the same checks and ends in `npm publish --dry-run`
# instead, in a job that can neither publish nor move a dist-tag. See CONTRIBUTING.md → Releasing
# for the steps and the one-time npm setup. npm's trusted publisher names this file, release.yml:
# keep the name.
on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20
  JAVA_VERSION: 21

jobs:
  publish:
    name: Publish to npm
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: macos-15 # the iOS checks need Xcode
    permissions:
      contents: read
      id-token: write # provenance, and trusted publishing when no NPM_TOKEN is set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to see that the tag is on main
          persist-credentials: false
      - name: Release checks
        # The checkout is this run's own commit, so ./ and $/ name the same action; ./ is the form
        # actionlint knows.
        uses: ./.github/actions/release-checks # zizmor: ignore[self-repository]
        with:
          mode: release
          tag: ${{ github.event.release.tag_name }}
          node-version: ${{ env.NODE_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          set -eu
          if [ -n "$NPM_TOKEN" ]; then
            # A granular access token (the first release, before the trusted publisher exists).
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
          else
            # No token: npm exchanges the job's OIDC token with the registry's trusted publisher.
            echo "no NPM_TOKEN secret: publishing as this repository's trusted publisher"
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"
          echo "published capacitor-background-transfer@$(node -p "require('./package.json').version") as $DIST_TAG"

  dry-run:
    name: Dry run (publishes nothing)
    # Started by hand. The same checks as the publish job, less the tag, then npm publish --dry-run.
    # It can't publish: no id-token permission (so no trusted publishing or provenance), no
    # NPM_TOKEN, and it never runs on a release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release checks
        # The checkout is this run's own commit, so ./ and $/ name the same action; ./ is the form
        # actionlint knows.
        uses: ./.github/actions/release-checks # zizmor: ignore[self-repository]
        with:
          mode: dry-run
          node-version: ${{ env.NODE_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: npm publish --dry-run
        run: |
          set -eu
          package=capacitor-background-transfer
          version="$(node -p "require('./package.json').version")"
          # npm refuses even a dry run over a version it already has, which is the usual state of
          # main between releases. Then this run's copy gets a throwaway pre-release version.
          if [ -n "$(npm view "$package@$version" version 2>/dev/null || true)" ]; then
            version="$version-dryrun.$GITHUB_RUN_ID"
            echo "$package@${version%-dryrun.*} is on npm already: dry-running it as $version"
            npm version "$version" --no-git-tag-version --allow-same-version
          fi
          npm publish --dry-run --access public --tag dry-run

  promote:
    name: Promote to latest
    # A pre-release unticked later: the version, already on npm under `next`, gets `latest` too. A
    # full release published outright fires this event alongside `published`; the version isn't on
    # npm yet then, and the publish job gives it `latest` itself.
    if: github.event_name == 'release' && github.event.action == 'released' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No caches on the way to npm (see .github/actions/release-checks): off explicitly. v4
          # warns that it doesn't know package-manager-cache yet; from v5 it stops the default cache.
          cache: ''
          package-manager-cache: false
      - name: Move the latest dist-tag to this version
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${TAG#v}"
          package=capacitor-background-transfer
          if [ -z "$(npm view "$package@$version" version 2>/dev/null || true)" ]; then
            echo "$package@$version isn't on npm yet: the publish job of this release gives it latest"
            exit 0
          fi
          if [ "$(npm view "$package" dist-tags.latest)" = "$version" ]; then
            echo "$package@$version is latest already"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::moving the latest dist-tag needs the NPM_TOKEN secret (trusted publishing covers npm publish only). By hand: npm dist-tag add $package@$version latest"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
          npm dist-tag add "$package@$version" latest
          echo "$package@$version is now latest"
