name: Release checks
description: >-
  Everything the release workflow checks before it publishes, shared by the publish job and the
  manual dry run: the version and the changelog (and, for a release, the tag), lint, TypeScript,
  Vitest, the build, JUnit, XCTest, the iOS build, a pinned npm and what the tarball will hold.
  Runs after actions/checkout, on macOS (the iOS checks need Xcode).

inputs:
  tag:
    description: >-
      The release's tag. When set, it must be vX.Y.Z for the version in package.json and its
      commit must be on main (which needs a checkout with fetch-depth 0). Empty for a dry run,
      which checks no tag.
    required: false
    default: ''
  node-version:
    description: Node.js version to set up.
    required: true
  java-version:
    description: JDK version to set up (Zulu).
    required: true

runs:
  using: composite
  steps:
    # No caches anywhere on the way to npm: a cache written by another workflow could change what
    # gets published. Caching is off explicitly, so a later version of these actions that caches
    # by default can't turn it back on unnoticed. setup-node v4 doesn't know
    # package-manager-cache yet and warns about it; from v5 it stops the default cache.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ''
        package-manager-cache: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: zulu
        java-version: ${{ inputs.java-version }}
        cache: ''

    - name: The version and the changelog (and the tag, for a release)
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -eu
        version="$(node -p "require('./package.json').version")"
        entry="$(grep -m1 "^## $version" CHANGELOG.md || true)"
        if [ -z "$entry" ]; then
          echo "::error::CHANGELOG.md has no '## $version' entry"
          exit 1
        fi
        case "$entry" in
          *nreleased*) echo "::error::CHANGELOG.md still says '$entry': date the entry"; exit 1 ;;
        esac
        if [ -z "$TAG" ]; then
          echo "package.json says $version and CHANGELOG.md has '$entry'; no tag to check"
          exit 0
        fi
        if [ "$TAG" != "v$version" ]; then
          echo "::error::the release is tagged $TAG but package.json says $version"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::the tagged commit $GITHUB_SHA is not on main"
          exit 1
        fi

    - shell: bash
      run: npm ci
    - name: Lint
      shell: bash
      run: npm run eslint && npm run prettier -- --check
    - name: Typecheck, Vitest and build
      shell: bash
      run: npm run typecheck && npm test && npm run build
    - name: Android unit tests
      shell: bash
      run: npm run test:android
    - name: iOS core tests
      shell: bash
      run: npm run test:ios
    - name: iOS build
      shell: bash
      run: npm run verify:ios

    - name: npm that can publish with provenance and trusted publishing
      shell: bash
      # zizmor: ignore[adhoc-packages] npm itself can't come from the project's lockfile; the
      # version is exact, and the Node 20 runner's own npm 10 can't use trusted publishing.
      run: npm install -g npm@11.21.2 && npm --version
    - name: What the package will hold
      shell: bash
      run: npm pack --dry-run
